<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Módulos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #fffaf2;
      color: #7B767A;
    }
    .btn-custom {
      background-color: #E3268B;
      border-color: #E3268B;
      color: white;
    }
    .btn-custom:hover {
      background-color: #c61b74;
      border-color: #c61b74;
    }
    .logo {
      height: 50px;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-light bg-light shadow mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <img src="Imdec.png" alt="Logo" class="logo me-2" />
        Módulos del Sistema
      </a>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Módulos del Sistema</h2>
      <button class="btn btn-custom" data-bs-toggle="modal" data-bs-target="#crearModulo">+ Agregar</button>
    </div>

    <table class="table table-hover">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Cronogramas</td>
          <td>Gestión de cronogramas y tareas</td>
          <td>
            <button class="btn btn-sm btn-outline-warning">Editar</button>
            <button class="btn btn-sm btn-outline-danger">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal para crear módulo -->
  <div class="modal fade" id="crearModulo" tabindex="-1" aria-labelledby="crearModuloLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="crearModuloLabel">Agregar Módulo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre" />
            </div>
            <div class="mb-3">
              <label for="descripcion" class="form-label">Descripción</label>
              <textarea class="form-control" id="descripcion" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-custom w-100">Guardar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
