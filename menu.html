<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Principal - Sistema IMDEC</title>

  <link rel="icon" type="image/png" href="Imdec.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    body {
      background-color: #fffaf2;
      color: #7B767A;
    }

    .navbar {
      background-color: #E3268B;
    }

    .navbar-brand img {
      height: 40px;
    }

    .nav-link, .navbar-brand, .welcome {
      color: rgb(240, 38, 213) !important;
    }

    .card {
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card-title {
      color: #E3268B;
    }

    .btn-custom {
      background-color: #E3268B;
      border: none;
      color: white;
    }

    .btn-custom:hover {
      background-color: #c81f7a;
    }
  </style>
</head>
<body>

  <!-- Navbar con logo -->
  <nav class="navbar navbar-expand-lg px-4">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="Imdec.png" alt="Logo">
      <span class="ms-2">Sistema IMDEC</span>
    </a>
    <div class="ms-auto">
      <a class="nav-link" href="logout.html">Cerrar sesión <i class="fas fa-sign-out-alt"></i></a>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="container mt-5">
    <div class="text-center mb-5">
      <h2 class="welcome">Bienvenido/a, Usuario</h2>
      <p class="lead">Selecciona un módulo para comenzar</p>
    </div>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card p-4 text-center">
          <i class="fas fa-calendar-alt fa-2x mb-3 text-danger"></i>
          <h5 class="card-title">Cronogramas</h5>
          <a href="cronogramas.html" class="btn btn-custom mt-2">Ver Cronogramas</a>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-4 text-center">
          <i class="fas fa-book fa-2x mb-3 text-danger"></i>
          <h5 class="card-title">Bitácoras</h5>
          <a href="bitacoras.html" class="btn btn-custom mt-2">Ver Bitácoras</a>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-4 text-center">
          <i class="fas fa-chart-bar fa-2x mb-3 text-danger"></i>
          <h5 class="card-title">Reportes</h5>
          <a href="reportes.html" class="btn btn-custom mt-2">Ver Reportes</a>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card p-4 text-center">
          <i class="fas fa-puzzle-piece fa-2x mb-3 text-danger"></i>
          <h5 class="card-title">Módulos</h5>
          <a href="modulos.html" class="btn btn-custom mt-2">Ver Módulos</a>
        </div>
      </div>



      <div class="col-md-4">
        <div class="card p-4 text-center">
          <i class="fas fa-clock fa-2x mb-3 text-danger"></i>
          <h5 class="card-title">Sesiones</h5>
          <a href="sesiones.html" class="btn btn-custom mt-2">Ver Sesiones</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
