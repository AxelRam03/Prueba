<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="Imdec.png">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

<style>
  body {
    background-color: #fffaf2;
    color: #7B767A;
  }
  .btn-custom {
    background-color: #E3268B;
    border-color: #E3268B;
    color: white;
  }
  .btn-custom:hover {
    background-color: #c61d73;
    border-color: #c61d73;
  }
  .navbar-brand img {
    height: 40px;
  }
</style>

</head>
<body>
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
      <h2 class="text-center mb-4">Crear Cuenta</h2>
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="name" placeholder="Tu nombre">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" placeholder="Contraseña segura">
        </div>
        <button type="submit" class="btn btn-custom w-100">Registrarse</button>
      </form>
      <div class="text-center mt-3">
        <a href="index.html" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión</a>
      </div>
    </div>
  </div>
</body>
</html>
